<div>
  <header class="header">
    <img
      class="logo"
      src="//www.themoviedb.org/assets/1/v4/logos/primary-green-d70eebe18a5eb5b166d5c1ef0796715b8d1a2cbc698f96d311d62f894ae87085.svg"
      role="presentation"
      alt="logo">
    <navbar (key)="goToPage($event)"></navbar>
  </header>
  <div class="content">

    @if (filmList && !filmDetails) {
      <div>
        <h1 class="content-title">{{pageTitle}}</h1>
        <div class="film-list">
          @for (item of filmList; track item) {
            <list-card
              [film]="item"
              (onDetails) = "getFullInfo($event)"
            ></list-card>
          }
        </div>
      </div>
    }

    @if (filmDetails) {
      <div>
        <button
          mat-stroked-button
          color="primary"
          class="button-back"
        (click)="goBack()">Back</button>
        <film-details
          [film]="filmDetails"
        ></film-details>
      </div>
    }
  </div>
</div>
